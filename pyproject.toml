[project]
name = "icu"
version = "0.1.0"
description = "BCI ward-round system"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.23.5",
    "scipy==1.9.3",
    "pandas==1.5.2",
    "scikit-learn==1.3.2",
    "matplotlib==3.6.2",
    "PyQt5==5.15.9",
    "pyqtgraph==0.13.3",
    "Flask==3.0.3",
    "Flask-Cors==3.0.10",
    "Flask-SocketIO==5.5.1",
    "python-socketio[client]==5.12.1",
    "eventlet==0.39.1",
    "requests==2.32.3",
    "pyserial==3.5",
    "ratelimiter==1.2.0.post0",
    "PyAutoGUI==0.9.54",
    "screeninfo==0.8.1",
    "psutil==7.0.0",
    "pygame==2.6.1",
    "edge-tts==7.2.3",
    "pywin32==306",
    "openpyxl==3.1.5",
    "torch==2.4.1",
    "torchinfo==1.8.0",
    "PsychoPy==2022.2.5",
    "pyglet==1.5.27",
    "moviepy==1.0.3",
    "imageio==2.31.6",
    "Pillow==9.5.0",
    "opencv-python==4.10.0.84",
    "ffpyplayer==4.5.1",
    "pyo==1.0.5",
    "psychtoolbox==3.0.19.14",
    "tables==3.8.0",
    "wxPython==4.2.1",
    "python-bidi==0.4.2",
]

[tool.uv]
required-environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
